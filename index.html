<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人导航 | My Navigation</title>
  <link rel="icon" href="https://cdn.jsdelivr.net/gh/Flygreenbaby/Images@main/img/202502161609500.ico"
    type="image/x-icon" />
  <!-- 引入字体图标库 (FontAwesome) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="nav.css" />
</head>

<body>

  <!--全屏欢迎-->
  <div id="welcome-overlay">
    <div class="welcome-card">
      欢迎来到 ahyun 的爱孤岛
    </div>
  </div>

  <!-- 主容器 -->
  <div class="glass-container">

    <!-- 左侧：个人信息 -->
    <div class="profile-section">
      <div class="avatar">
        <!-- 头像图片链接-->
        <img src="https://cdn.jsdelivr.net/gh/Flygreenbaby/Images@main/img/202502092051810.png" alt="AHYUN">
      </div>
      <h1 class="name">AHYUN</h1>
      <p class="bio">只是一个lazy fooooool</p>

      <div class="social-links">
        <a href="https://github.com/Flygreenbaby" class="social-btn" title="Github"><i class="fab fa-github"></i></a>
        <a href="#" class="social-btn" title="Twitter"><i class="fab fa-twitter"></i></a>
        <a href="mailto:hxqlst@163.com" class="social-btn" title="Email"><i class="fas fa-envelope"></i></a>
        <a href="#" class="social-btn" title="WeChat"><i class="fab fa-weixin"></i></a>
      </div>
      <br>
      <p style="transform: scale(1); transform-origin: left; font-size: 10px;">放心好了,除了github和邮箱都是空连接</p>
    </div>

    <!-- 右侧：功能区 -->
    <div class="content-section">
      <!-- 时间日期 -->
      <div class="clock-container">
        <div class="time" id="time">00:00:00</div>
        <div class="date" id="date">加载中...</div>
      </div>

      <!-- 一言 (每日金句) -->
      <div class="hitokoto-card">
        <p class="hitokoto-text" id="hitokoto_text">“正在获取来自远方的文字...”</p>
        <p class="hitokoto-from" id="hitokoto_from">—— 稍候</p>
      </div>

      <!-- 快捷导航 -->
      <div class="nav-buttons">
        <a href="https://blog.ahyun.org.cn" class="nav-item">
          <i class="fas fa-blog"></i>
          <span>我的博客</span>
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-image"></i>
          <span>装修中</span>
          <!-- p中文本为摄影作品 -->
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-book"></i>
          <span>装修中</span>
          <!-- p中文本为学习笔记 -->
        </a>
        <a href="#" class="nav-item">
          <i class="fas fa-server"></i>
          <span>装修中</span>
          <!-- p中文本为实验室 -->
        </a>
      </div>
    </div>
  </div>

  <!-- 页脚注释 -->
  <footer class="footer">
    <!-- 有趣的备案信息 -->
    <a href="https://icp.gov.moe/?keyword=20250406" target="_blank">萌ICP备20250406号</a>
    <a href="https://icp.redcha.cn/beian/ICP-2025100205.html" title="茶ICP备2025100205号"
      target="_blank">茶ICP备2025100205号</a>
    <p>© 2025 ahyun</p>
  </footer>

  <script src="nav.js" defer></script>

</body>

</html>
